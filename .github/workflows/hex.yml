name: Hex project integration
on:
  push:
    paths: ['Scripts/**', 'Scenes/**', 'Resources/**', 'Assets/Hex/**', 'addons/hex_runtime/**', 'Tests/**', 'tools/**', 'package*.json', 'requirements-dev.txt', '.editorconfig', '.clang-format', 'gdlintrc', '.prettier*', 'eslint.config.cjs', 'project.godot', '.github/workflows/hex.yml']
  pull_request:
    paths: ['Scripts/**', 'Scenes/**', 'Resources/**', 'Assets/Hex/**', 'addons/hex_runtime/**', 'Tests/**', 'tools/**', 'package*.json', 'requirements-dev.txt', '.editorconfig', '.clang-format', 'gdlintrc', '.prettier*', 'eslint.config.cjs', 'project.godot', '.github/workflows/hex.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  style:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: python tools/check_code_style.py
      - run: npm run check:js
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc make
      - name: Compile native runtime (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash addons/hex_runtime/build.sh
      - name: Compile native runtime (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: HEX_PLATFORM=Windows CC=gcc bash addons/hex_runtime/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DaGam-Hex-project-${{ runner.os }}
          path: |
            ./
            !.git/**
            !.godot/**
          include-hidden-files: true
          retention-days: 14
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash addons/hex_runtime/build.sh
      - name: Get Godot 4.6.3
        run: |
          curl -L --fail https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Validate bundle and import
        run: |
          python3 tools/hex/build_engine.py
          python3 tools/player/build_player_frames.py
          git diff --exit-code Resources/Hex/Engine/battle.js Resources/Player/adventurer_frames.tres
          Godot_v4.6.3-stable_linux.x86_64 --headless --path . --editor --import
      - name: Native runtime, full match, card coverage and UI
        run: |
          set -o pipefail
          for test in runtime_smoke native_match rules_test ui_smoke ui_match board_3d_test status_test; do
            Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script "res://Tests/Hex/$test.gd" 2>&1 | tee "/tmp/$test.log"
            if grep -E 'SCRIPT ERROR|Hex runtime:|ERROR:' "/tmp/$test.log"; then exit 1; fi
          done
      - name: Existing world, menu and shared-save integration
        run: |
          set -o pipefail
          Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://Tests/Hex/Integration.tscn 2>&1 | tee /tmp/integration.log
          if grep -E 'SCRIPT ERROR|Hex runtime:|ERROR:' /tmp/integration.log; then exit 1; fi
      - name: World encounters and native-resolution rendering
        run: |
          set -o pipefail
          Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://Tests/Hex/Encounter.tscn 2>&1 | tee /tmp/encounter.log
          if grep -E 'SCRIPT ERROR|Hex runtime:|ERROR:' /tmp/encounter.log; then exit 1; fi
      - name: Deck builder and selected battle decks
        run: |
          set -o pipefail
          Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://Tests/Hex/DeckBuilder.tscn 2>&1 | tee /tmp/deck-builder.log
          if grep -E 'SCRIPT ERROR|Hex runtime:|ERROR:' /tmp/deck-builder.log; then exit 1; fi
      - name: Animated opening and mulligan flow
        run: |
          set -o pipefail
          Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://Tests/Hex/Opening.tscn 2>&1 | tee /tmp/opening.log
          if grep -E 'SCRIPT ERROR|Hex runtime:|ERROR:' /tmp/opening.log; then exit 1; fi
      - name: RPG-TCG menus and Farmer save compatibility
        run: |
          set -o pipefail
          Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://Tests/Hex/RpgTCG.tscn 2>&1 | tee /tmp/rpg-tcg.log
          if grep -E 'SCRIPT ERROR|Hex runtime:|ERROR:' /tmp/rpg-tcg.log; then exit 1; fi
      - name: Player directional animation and movement
        run: |
          set -o pipefail
          Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://Tests/Player/player_animation_test.gd 2>&1 | tee /tmp/player-animation.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/player-animation.log; then exit 1; fi
      - name: Terrain autotile edges and editor painting
        run: |
          set -o pipefail
          Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://Tests/Player/terrain_tiles_test.gd 2>&1 | tee /tmp/terrain-tiles.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/terrain-tiles.log; then exit 1; fi
      - name: Render the battle UI
        run: xvfb-run -a Godot_v4.6.3-stable_linux.x86_64 --path . --audio-driver Dummy --rendering-method gl_compatibility --rendering-driver opengl3 res://Tests/Hex/Integration.tscn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hex-test-evidence
          path: |
            /home/runner/.local/share/godot/app_userdata/DaGam/hex-integrated-screen.png
            /home/runner/.local/share/godot/app_userdata/DaGam/hex-hover-screen.png
            /tmp/*_smoke.log
            /home/runner/.local/share/godot/app_userdata/DaGam/native-test-results.json
